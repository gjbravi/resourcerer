name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow dispatches CI on release-please's branch: pull requests opened with
  # GITHUB_TOKEN do not trigger workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change needs testing at all:
  # - a change that only touches docs, the docs site, agent skills or repository metadata does not change the
  #   binary, image or chart (the Docs workflow builds the site);
  # - a push to main whose tree already passed CI in the pull request that was squash-merged is not tested
  #   again: the ruleset requires pull requests to be up to date, so the tree is the same;
  # - a change that only touches the UI (web/, besides docs) skips e2e, which checks the API and the cluster, never
  #   the UI. The release pull request's dispatched run has no base, so every release still runs e2e.
  # Skipped jobs count as passed for the required checks.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.check.outputs.tree }}
      skip: ${{ steps.check.outputs.skip }}
      skip-e2e: ${{ steps.check.outputs.skip-e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          case "$GITHUB_EVENT_NAME" in
            # The checkout of a pull request is its merge commit; the first parent is the base.
            pull_request) base='HEAD^1' ;;
            push) base="$BEFORE" ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null; then
            git diff --name-only "$base" HEAD > changed.txt
            echo "changed files:"; cat changed.txt
            docs='(\.md$|\.mdx$|^docs/|^website/|^mkdocs\.yml$|^\.github/workflows/docs\.yaml$|^\.agents/|^\.claude/|^LICENSE$|^\.github/CODEOWNERS$|^\.github/ISSUE_TEMPLATE/|^\.github/pull_request_template\.md$)'
            if [ -s changed.txt ] && ! grep -qvE "$docs" changed.txt; then
              echo "only docs and metadata changed"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # web/embed.go is Go: it decides what the binary serves.
            if [ -s changed.txt ] && ! grep -vE "$docs" changed.txt | grep -qvE '^web/' && ! grep -qx web/embed.go changed.txt; then
              echo "only the UI changed: e2e does not check it"
              echo "skip-e2e=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$tree" -q '[.artifacts[] | select(.expired | not)] | length')
            if [ "$n" -gt 0 ]; then
              echo "tree $tree already passed CI"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

  # Runs on every change, docs-only ones included: it is what keeps the contributor and agent docs in step with the
  # code.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: make lint-docs
        env:
          MERMAID: "1"

  go:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # internal/server/auth renders the chart from its tests and parses what comes out, so the Go tests need helm too:
      # without it, the check that the chart writes the configuration the server reads would quietly stop running.
      - uses: azure/setup-helm@v5
      - run: go vet ./...
      - run: go tool golangci-lint run
      - run: go test -race -coverprofile=coverage.out ./...
      - run: make verify-generate
      - run: make lint-workflows

  web:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  chart:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/resourcerer
      - run: helm lint charts/resourcerer-crds
      - run: helm template resourcerer charts/resourcerer >/dev/null
      - run: helm template resourcerer-crds charts/resourcerer-crds >/dev/null
      - name: Unknown values are rejected
        run: |
          if helm template rz charts/resourcerer --set unknownKey=1 >/dev/null 2>&1; then
            echo "::error::an unknown top-level value was accepted by charts/resourcerer"
            exit 1
          fi
      # Helm merges a parent chart's global values into each subchart before validating its schema, so a chart that
      # rejects unknown keys also has to accept `global`, or no parent that sets one can use it.
      - name: A parent chart's global values render
        run: |
          for chart in resourcerer resourcerer-crds; do
            rm -rf "$RUNNER_TEMP/global"
            mkdir -p "$RUNNER_TEMP/global/charts"
            cp -R "charts/$chart" "$RUNNER_TEMP/global/charts/"
            printf 'apiVersion: v2\nname: parent\nversion: 0.1.0\n' > "$RUNNER_TEMP/global/Chart.yaml"
            helm template parent "$RUNNER_TEMP/global" --set global.infrastructure.region=us-east-1 >/dev/null
          done
      - name: The CRDs render as four resources, kept on uninstall
        run: |
          helm template resourcerer-crds charts/resourcerer-crds > "$RUNNER_TEMP/crds.yaml"
          test "$(grep -c '^kind: CustomResourceDefinition' "$RUNNER_TEMP/crds.yaml")" = 4
          test "$(grep -c 'helm.sh/resource-policy: keep' "$RUNNER_TEMP/crds.yaml")" = 4
          test "$(grep -c 'app.kubernetes.io/managed-by: Helm' "$RUNNER_TEMP/crds.yaml")" = 4
      - run: helm template resourcerer charts/resourcerer --set selection=label --set readOnly=true --set applier.enabled=false --set controller.replicas=2 --set server.ingress.enabled=true >/dev/null
      # None of the renders above takes auth.strategy=oidc, whose ConfigMap is the server's own configuration: the
      # server parses it strictly and exits when a value is one it refuses, and on an upgrade it keeps the last good
      # one and only crash-loops at the next restart. These steps keep the chart and the parser in step. The fixture
      # is the one internal/server/auth/chart_test.go feeds to the parser, which fails if the chart writes a key the
      # server does not know.
      - name: The OIDC values render
        env:
          OIDC_VALUES: internal/server/auth/testdata/chart-values.yaml
        run: helm template rz charts/resourcerer -n resourcerer -f "$OIDC_VALUES" >/dev/null
      - name: Only what OIDC requires renders too
        run: |
          helm template rz charts/resourcerer -n resourcerer \
            --set auth.strategy=oidc \
            --set auth.oidc.issuer=https://sso.example.com/realms/example \
            --set auth.oidc.clientID=resourcerer \
            --set auth.oidc.clientSecretSecretRef.name=resourcerer-oidc \
            --set auth.oidc.clientSecretSecretRef.key=clientSecret \
            --set auth.session.keySecretRef.name=resourcerer-session \
            --set auth.session.keySecretRef.key=key >/dev/null
      - name: The OIDC ConfigMap is the document the parser test reads
        env:
          OIDC_VALUES: internal/server/auth/testdata/chart-values.yaml
          OIDC_GOLDEN: internal/server/auth/testdata/oidc.full.yaml
        run: |
          # Helm 3 ends a rendered manifest with one newline and Helm 4 with three, which is the manifest trailer and
          # not part of the ConfigMap, so the comparison normalizes it: the check is about the document the server
          # parses, where a difference is a key or a value, not a trailing blank line.
          helm template rz charts/resourcerer -n resourcerer -f "$OIDC_VALUES" \
            -s templates/auth-configmap.yaml |
            sed -n '/^  oidc.yaml: |$/,$p' | tail -n +2 | sed 's/^    //' |
            python3 -c 'import sys; sys.stdout.write(sys.stdin.read().rstrip("\n") + "\n")' |
            diff -u "$OIDC_GOLDEN" -

  e2e:
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.skip-e2e != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exposes the cache service to the docker build below, which runs outside an action.
      - uses: crazy-max/ghaction-github-runtime@v4
      - uses: docker/setup-buildx-action@v4
      # Carries the Go and npm cache mounts of the Dockerfile across runs: with layers alone, any Go change compiles
      # every dependency again (~2.5 min), longer than kind takes to start. e2e-cache saves it on main.
      - uses: actions/cache@v6
        id: cache
        with:
          path: buildkit-cache
          key: buildkit-e2e-${{ hashFiles('go.sum', 'web/package-lock.json') }}
          restore-keys: buildkit-e2e-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "buildkit-cache/go-mod": "/go/pkg/mod",
              "buildkit-cache/go-build": "/root/.cache/go-build",
              "buildkit-cache/npm": "/root/.npm"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}
      # The image builds while kind starts; together they used to take most of the job one after the other.
      - name: Build the image in the background
        run: |
          (docker buildx build --load -t resourcerer:e2e --build-arg VERSION=e2e \
            --cache-from type=gha,scope=e2e --cache-to type=gha,mode=max,scope=e2e . \
            > "$RUNNER_TEMP/build.log" 2>&1; echo $? > "$RUNNER_TEMP/build.rc") &
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: resourcerer
          config: hack/kind-config.yaml
      - run: make kind-up
      - name: Wait for the image
        run: |
          while [ ! -f "$RUNNER_TEMP/build.rc" ]; do sleep 2; done
          cat "$RUNNER_TEMP/build.log"
          exit "$(cat "$RUNNER_TEMP/build.rc")"
      - run: make kind-install IMG=resourcerer:e2e
      - run: make e2e

  # A pull request reads only the caches saved on main, and a push to main rarely runs e2e (its tree passed in the
  # pull request), so e2e's build cache is saved here, once per go.sum and package-lock.json.
  e2e-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        id: cache
        with:
          path: buildkit-cache
          key: buildkit-e2e-${{ hashFiles('go.sum', 'web/package-lock.json') }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "buildkit-cache/go-mod": "/go/pkg/mod",
              "buildkit-cache/go-build": "/root/.cache/go-build",
              "buildkit-cache/npm": "/root/.npm"
            }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: docker buildx build --build-arg VERSION=e2e .

  # Records the tested tree, so the push to main after a squash merge and the release can skip CI.
  passed:
    needs: [gate, go, web, chart, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - run: echo "${{ needs.gate.outputs.tree }}" > tree.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ci-passed-${{ needs.gate.outputs.tree }}
          path: tree.txt
          retention-days: 90
      # Check runs of a dispatched run are not linked to pull requests, so release-please's pull request would
      # wait for the required checks forever; commit statuses with the same names are.
      - name: Report the required checks on the commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for check in go web chart e2e; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context="$check" \
              -f description="Passed in a dispatched CI run" -f target_url="$RUN_URL" >/dev/null
          done
