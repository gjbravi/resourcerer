name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI first and only publishes when it passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go tool golangci-lint run
      - run: go test -race -coverprofile=coverage.out ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/resourcerer
      - run: helm template resourcerer charts/resourcerer >/dev/null
      - run: helm template resourcerer charts/resourcerer --set selection=label --set readOnly=true --set applier.enabled=false --set controller.replicas=2 --set server.ingress.enabled=true >/dev/null

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web, chart]
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: resourcerer
          config: hack/kind-config.yaml
      - run: make kind-up
      - run: make kind-deploy IMG=resourcerer:e2e
      - run: make e2e
