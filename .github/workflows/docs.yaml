name: Docs

# Builds the documentation site (Zensical: mkdocs.yml, pages in docs/, tooling in website/) on every change to it,
# and publishes it to GitHub Pages from main.
on:
  pull_request:
    paths: ["docs/**", "website/**", "mkdocs.yml", ".github/workflows/docs.yaml"]
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "mkdocs.yml", ".github/workflows/docs.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: make docs-build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deployment at a time, and never cancel one halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
