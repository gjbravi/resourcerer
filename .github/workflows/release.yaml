name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  image:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      # Keyless signing with Sigstore uses the workflow's OIDC identity.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=resourcerer
            org.opencontainers.image.description=Rightsize Kubernetes requests from Prometheus usage history
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4
      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.push.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@v4
      - name: Package, push and sign chart
        id: push
        env:
          VERSION: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          v="${VERSION#v}"
          helm package charts/resourcerer --version "$v" --app-version "$v" -d dist
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          echo "$TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          out=$(helm push "dist/resourcerer-$v.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1)
          echo "$out"
          digest=$(echo "$out" | awk '/Digest:/ {print $2}')
          cosign sign --yes "ghcr.io/$OWNER/charts/resourcerer@$digest"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/*.tgz

  github-release:
    runs-on: ubuntu-latest
    needs: [image, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.tgz
          body: |
            ## Install

            ```bash
            helm install resourcerer oci://ghcr.io/${{ github.repository_owner }}/charts/resourcerer \
              --version ${{ needs.chart.outputs.version }} -n resourcerer --create-namespace \
              --set prometheus.url=http://prometheus-server.monitoring.svc
            ```

            Image: `ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}`, signed with cosign (keyless).
