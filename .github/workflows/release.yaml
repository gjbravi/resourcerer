name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release pull request with the changelog from Conventional Commits up to date. Merging it
  # tags the commit and creates the GitHub release; the jobs below then publish the artifacts.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI on the release pull request
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.rp.outputs.pr }}
        run: gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$(jq -r .headBranchName <<< "$PR")"

  # Publishes only a tree that passed CI; CI is not run a third time.
  verify:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$tree" -q '[.artifacts[] | select(.expired | not)] | length')
          if [ "$n" -eq 0 ]; then
            echo "::error::No passing CI run for tree $tree; run CI on ${{ needs.release-please.outputs.sha }} and re-run this workflow."
            exit 1
          fi

  image:
    needs: [release-please, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing with Sigstore uses the workflow's OIDC identity.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
          labels: |
            org.opencontainers.image.title=resourcerer
            org.opencontainers.image.description=Rightsize Kubernetes requests from Prometheus usage history
            org.opencontainers.image.licenses=Apache-2.0
      # Carries the Go and npm cache mounts of the Dockerfile across runs; layers alone rebuild Go from scratch.
      - uses: actions/cache@v5
        id: cache
        with:
          path: buildkit-cache
          key: buildkit-${{ hashFiles('go.sum', 'web/package-lock.json') }}
          restore-keys: buildkit-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "buildkit-cache/go-mod": "/go/pkg/mod",
              "buildkit-cache/go-build": "/root/.cache/go-build",
              "buildkit-cache/npm": "/root/.npm"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.release-please.outputs.tag }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

  chart:
    needs: [release-please, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Package, push and sign the charts
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for chart in resourcerer resourcerer-crds; do
            helm package "charts/$chart" --version "$VERSION" --app-version "$VERSION" -d dist
          done
          # The same definitions as a plain file, for installations where Helm may not touch cluster-scoped objects.
          cp charts/resourcerer-crds/files/crds.yaml "dist/resourcerer-crds-$VERSION.yaml"
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          echo "$TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          for chart in resourcerer resourcerer-crds; do
            out=$(helm push "dist/$chart-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1)
            echo "$out"
            digest=$(echo "$out" | awk '/Digest:/ {print $2}')
            cosign sign --yes "ghcr.io/$OWNER/charts/$chart@$digest"
          done
      - name: Attach charts and install notes to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          gh release upload "$TAG" dist/*.tgz "dist/resourcerer-crds-$VERSION.yaml" --repo "$GITHUB_REPOSITORY"
          {
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body
            cat <<NOTES

          ## Install

          The CRDs ship in a chart of their own, installed as a separate release before resourcerer:

          \`\`\`bash
          helm install resourcerer-crds oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/resourcerer-crds \\
            --version ${VERSION} -n resourcerer --create-namespace
          helm install resourcerer oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/resourcerer \\
            --version ${VERSION} -n resourcerer --create-namespace \\
            --set prometheus.url=http://prometheus-server.monitoring.svc
          \`\`\`

          Upgrading runs the same two commands in the same order. **Installing this version over 0.9.0 or earlier needs
          a one-time adoption step**, because those releases delivered the CRDs from the chart's \`crds/\` directory,
          which Helm does not track:

          \`\`\`bash
          # Helm 4
          helm install resourcerer-crds oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/resourcerer-crds \\
            --version ${VERSION} -n resourcerer --create-namespace --take-ownership

          # Helm 3
          for crd in recommendations.resourcerer.io applypolicies.resourcerer.io clusterapplypolicies.resourcerer.io; do
            kubectl label crd "\$crd" app.kubernetes.io/managed-by=Helm --overwrite
            kubectl annotate crd "\$crd" meta.helm.sh/release-name=resourcerer-crds meta.helm.sh/release-namespace=resourcerer --overwrite
          done
          \`\`\`

          A team that owns its CRDs can apply the attached \`resourcerer-crds-${VERSION}.yaml\` with
          \`kubectl apply --server-side -f\` instead of installing the first chart.

          Image: \`ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}\`, signed with cosign (keyless). Both charts are signed too.
          NOTES
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
