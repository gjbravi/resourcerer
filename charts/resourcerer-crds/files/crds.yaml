    listKind: DecisionModelList
    plural: decisionmodels
    shortNames:
    - dm
    singular: decisionmodel
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DecisionModel is the model a user can ask, from the workload page, whether a recommendation is safe to apply. Its
          answer helps the user decide; it never applies anything. Only the one named "default" is used.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              credentialsSecretRef:
                description: CredentialsSecretRef holds the API token, for typesafe.
                properties:
                  key:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              endpoint:
                description: Endpoint is the URL of the model's POST /v1/systemone.
                pattern: ^https?://
                type: string
              model:
                description: Model names the model behind the endpoint, such as decider-4b,
                  shown with every answer.
                maxLength: 128
                minLength: 1
                type: string
              provider:
                description: DecisionProvider is the kind of server behind a DecisionModel's
                  endpoint.
                enum:
                - decider
                - typesafe
                type: string
              timeoutSeconds:
                default: 30
                description: TimeoutSeconds bounds one request to the model.
                format: int32
                maximum: 300
                minimum: 1
                type: integer
            required:
            - endpoint
            - model
            - provider
            type: object
