---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: applypolicies.resourcerer.io
spec:
  group: resourcerer.io
  names:
    kind: ApplyPolicy
    listKind: ApplyPolicyList
    plural: applypolicies
    shortNames:
    - ap
    singular: applypolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.appliesTo
      name: Applies to
      type: string
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ApplyPolicy governs when the workloads in its namespace may be applied. A team declares its own
          rules without touching the platform's configuration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplyPolicySpec governs applies for the workloads in its
              own namespace.
            properties:
              appliesTo:
                description: |-
                  AppliesTo is the kinds of apply the policy governs. Empty: Auto, so a policy never blocks a
                  person unless it says so.
                items:
                  description: AppliesTo is a kind of apply a policy governs.
                  enum:
                  - Auto
                  - Manual
                  type: string
                type: array
              limits:
                description: Limits bounds how often applies happen.
                properties:
                  cooldown:
                    description: |-
                      Cooldown is the minimum time between two changes to the same workload, counted from the last
                      apply or revert of any hash, as a Go duration such as `24h`.
                    type: string
                    x-kubernetes-validations:
                    - message: cooldown must be a duration such as 24h
                      rule: self.matches(r'^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$')
                type: object
              mode:
                default: Enforce
                description: Mode is Enforce, which blocks, or Audit, which only reports
                  what it would block.
                enum:
                - Enforce
                - Audit
                type: string
              priority:
                description: |-
                  Priority decides which policy is reported when more than one blocks: the highest, then cluster
                  policies before namespaced ones, then by name. It never makes a policy stronger or weaker.
                format: int32
                type: integer
              when:
                description: When is when an apply may start.
                properties:
                  freezes:
                    description: Freezes are periods nothing may be applied in, windows
                      or not.
                    items:
                      description: ApplyFreeze is a period nothing may be applied
                        in.
                      properties:
                        from:
                          format: date-time
                          type: string
                        reason:
                          description: Reason explains the freeze in the UI and in
                            the decision.
                          type: string
                        to:
                          description: To is exclusive.
                          format: date-time
                          type: string
                      required:
                      - from
                      - to
                      type: object
                      x-kubernetes-validations:
                      - message: to must be after from
                        rule: self.from < self.to
                    maxItems: 64
                    type: array
                  windows:
                    description: |-
                      Windows are the periods an apply may start in. Empty: any time. Windows are a union: inside any
                      of them the apply may start, and freezes still apply.
                    items:
                      description: ApplyWindow is a recurring period, in UTC, an apply
                        may start in.
                      properties:
                        days:
                          description: |-
                            Days are the weekdays the window opens on, Mon to Sun, in UTC. Empty: every day. An overnight window
                            opens on its From day and closes on the next one.
                          items:
                            enum:
                            - Mon
                            - Tue
                            - Wed
                            - Thu
                            - Fri
                            - Sat
                            - Sun
                            type: string
                          type: array
                        from:
                          description: From is the time the window opens, HH:MM in
                            UTC.
                          maxLength: 5
                          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                        to:
                          description: |-
                            To is the time the window closes, HH:MM in UTC, exclusive. Equal to From is invalid; earlier than
                            From crosses midnight.
                          maxLength: 5
                          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                      required:
                      - from
                      - to
                      type: object
                      x-kubernetes-validations:
                      - message: a window cannot open and close at the same time
                        rule: self.from != self.to
                    maxItems: 32
                    type: array
                type: object
              workloadSelector:
                description: |-
                  WorkloadSelector narrows the workloads the policy governs, matched against the workload's labels
                  and its pod template's. Empty: every workload in scope.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
