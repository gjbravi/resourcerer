---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: applypolicies.resourcerer.io
spec:
  group: resourcerer.io
  names:
    kind: ApplyPolicy
    listKind: ApplyPolicyList
    plural: applypolicies
    shortNames:
    - ap
    singular: applypolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.appliesTo
      name: Applies to
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ApplyPolicy governs when the workloads in its namespace are applied: a team writes its own rules
          without touching the platform's configuration, and can only tighten what the cluster policies set.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplyPolicySpec governs the applies of the workloads in its
              own namespace.
            properties:
              appliesTo:
                description: |-
                  AppliesTo is the kinds of apply the policy governs: Auto, Manual, or both. Empty means Auto, so a
                  policy never holds a person back unless it says so.
                items:
                  description: ApplyKind is a kind of apply a policy can govern.
                  enum:
                  - Auto
                  - Manual
                  type: string
                maxItems: 2
                type: array
              freezes:
                description: Freezes are the periods nothing is applied in, windows
                  or not.
                items:
                  description: ApplyFreeze is a period nothing is applied in, windows
                    or not.
                  properties:
                    from:
                      format: date-time
                      type: string
                    reason:
                      description: Reason explains the freeze in the decision and
                        the UI.
                      maxLength: 256
                      type: string
                    to:
                      description: To is exclusive.
                      format: date-time
                      type: string
                  required:
                  - from
                  - to
                  type: object
                  x-kubernetes-validations:
                  - message: to must be after from
                    rule: self.from < self.to
                maxItems: 64
                type: array
              mode:
                default: Enforce
                description: Mode is Enforce, which blocks, or Audit, which only records
                  what it would have blocked.
                enum:
                - Enforce
                - Audit
                type: string
              rate:
                description: Rate bounds how many applies happen, and how close together.
                properties:
                  cooldown:
                    description: |-
                      Cooldown is the minimum time between two changes to the same workload, an apply or a revert,
                      as a Go duration such as 24h.
                    type: string
                  maxConcurrent:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MaxConcurrent is the applies in progress at once among the workloads the policy selects: the
                      rollout has not finished yet. A whole number, or a percentage of those workloads with
                      auto-deploy enabled, rounded up. 0 blocks every automatic apply.
                    pattern: ^([0-9]{1,4}|[0-9]{1,3}%)$
                    x-kubernetes-int-or-string: true
                  maxPerHour:
                    description: MaxPerHour is the applies allowed in any hour among
                      the workloads the policy selects. 0 blocks them.
                    format: int32
                    minimum: 0
                    type: integer
                  perNamespace:
                    description: |-
                      PerNamespace bounds the applies in progress in one namespace, the workload's, counting rollouts
                      resourcerer did not start too.
                    properties:
                      maxConcurrent:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          MaxConcurrent is the applies in progress in the namespace, resourcerer's and anyone else's
                          rollouts alike. A whole number, or a percentage of the managed workloads in the namespace,
                          rounded up. 1 allows one rollout at a time in the namespace.
                        pattern: ^([0-9]{1,4}|[0-9]{1,3}%)$
                        x-kubernetes-int-or-string: true
                    type: object
                  spread:
                    description: |-
                      Spread delays each held apply to a stable offset in [0, spread) after the window opens, so a herd
                      does not start every rollout at once. Capped at the window's length.
                    type: string
                type: object
              windows:
                description: |-
                  Windows are the periods an apply may start in. Empty means any time. They are a union: inside any
                  of them the apply may start, and the freezes still hold.
                items:
                  description: ApplyWindow is a recurring period, in a time zone,
                    an apply may start in.
                  properties:
                    days:
                      description: |-
                        Days are the weekdays the window opens on. Empty means every day. A window whose To is earlier
                        than its From crosses midnight and closes on the day after the one it opened on.
                      items:
                        description: Weekday names a day a window opens on.
                        enum:
                        - Mon
                        - Tue
                        - Wed
                        - Thu
                        - Fri
                        - Sat
                        - Sun
                        type: string
                      maxItems: 7
                      type: array
                    from:
                      description: From is the local time the window opens, HH:MM.
                      maxLength: 5
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                      type: string
                    timeZone:
                      description: |-
                        TimeZone is an IANA name such as America/Sao_Paulo. Empty means UTC. With it, the window is open
                        while the local clock shows a time in [from, to): a time the clock skips is the instant it
                        resumes, a time it repeats is its first occurrence, so a window never opens early.
                      maxLength: 64
                      type: string
                    to:
                      description: To is the local time the window closes, HH:MM,
                        exclusive.
                      maxLength: 5
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                      type: string
                  required:
                  - from
                  - to
                  type: object
                  x-kubernetes-validations:
                  - message: to must differ from from
                    rule: self.from != self.to
                maxItems: 32
                type: array
              workloadSelector:
                description: |-
                  WorkloadSelector narrows the workloads the policy governs, matched against the workload's labels
                  and its pod template's. Empty governs every workload in scope.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            type: object
          status:
            description: |-
              ApplyPolicyHealth says how many managed workloads a policy governs, and whether resourcerer can
              interpret it. A policy it cannot read holds the applies it governs, so the condition says why.
            properties:
              conditions:
                description: 'Conditions hold Valid: False with the error when the
                  policy cannot be interpreted.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              workloads:
                description: |-
                  Workloads is how many managed workloads the policy currently governs. Nil until resourcerer has
                  looked; zero says the policy selects nothing, which is worth seeing.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
