              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterApplyPolicySpec governs applies for the workloads
              in the namespaces it selects.
            properties:
              appliesTo:
                description: |-
                  AppliesTo is the kinds of apply the policy governs. Empty: Auto, so a policy never blocks a
                  person unless it says so.
                items:
                  description: AppliesTo is a kind of apply a policy governs.
                  enum:
                  - Auto
