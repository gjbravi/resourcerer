{{- with .Values.metrics.grafanaDashboard }}
{{- if .enabled }}
# How resourcerer is doing across the cluster, for a Grafana that loads dashboards from labelled ConfigMaps (the
# sidecar of the Grafana chart and kube-prometheus-stack). The JSON is generated by hack/grafana-dashboard.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "resourcerer.fullname" $ }}-grafana-dashboard
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "resourcerer.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  resourcerer.json: |-
    {{- $.Files.Get "dashboards/resourcerer.json" | nindent 4 }}
{{- end }}
{{- end }}
