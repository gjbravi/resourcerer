{{- if .Values.rbac.create }}
{{- $fullname := include "resourcerer.fullname" . }}
{{- $components := list "controller" "server" }}
{{- if .Values.applier.enabled }}{{ $components = append $components "applier" }}{{ end }}
{{- range $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-{{ . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "resourcerer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-{{ . }}
  labels:
    {{- include "resourcerer.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-{{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-{{ . }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
# Reads the cluster and Prometheus; writes only Recommendations and Events.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-controller
  labels:
    {{- include "resourcerer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resourcerer.io"]
    resources: ["recommendations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resourcerer.io"]
    resources: ["recommendations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["events.k8s.io", ""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Reads for the UI; writes apply requests on Recommendations and resourcerer.io/* annotations.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "resourcerer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"{{ if not .Values.readOnly }}, "patch"{{ end }}]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"{{ if not .Values.readOnly }}, "patch"{{ end }}]
  - apiGroups: [""]
    resources: ["configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resourcerer.io"]
    resources: ["recommendations"]
    verbs: ["get", "list", "watch"{{ if not .Values.readOnly }}, "patch"{{ end }}]
{{- if .Values.applier.enabled }}
---
# The only role that changes workload resources and HPA targets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "resourcerer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["resourcerer.io"]
    resources: ["recommendations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resourcerer.io"]
    resources: ["recommendations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["events.k8s.io", ""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
{{- end }}
