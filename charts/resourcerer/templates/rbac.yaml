{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "resourcerer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resourcerer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "resourcerer.fullname" . }}
  labels:
    {{- include "resourcerer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    # patch is used by the UI to set the resourcerer.io/enabled label and mode annotation.
    verbs: ["get", "list", "watch"{{ if not .Values.ui.readOnly }}, "patch"{{ end }}]
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["events.k8s.io", ""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "resourcerer.fullname" . }}
  labels:
    {{- include "resourcerer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "resourcerer.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "resourcerer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if gt (int .Values.replicaCount) 1 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "resourcerer.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resourcerer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "resourcerer.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resourcerer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "resourcerer.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "resourcerer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
