{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "resourcerer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resourcerer.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      resourcerer.io/metrics: "true"
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      # The metrics carry the namespace and container of the workload they describe, not of our pods.
      honorLabels: true
{{- end }}
