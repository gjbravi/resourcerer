image:
  repository: ghcr.io/gjbravi/resourcerer
  # -- Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Cluster name shown in the UI.
clusterName: kubernetes

# -- Which workloads get a recommendation.
# `all`: every Deployment, StatefulSet and DaemonSet outside excludedNamespaces;
# opt out with the `resourcerer.io/enabled=false` label on the workload or namespace.
# `label`: only workloads with `resourcerer.io/enabled=true` on the workload or its namespace.
selection: all

# -- Namespaces that are never managed. The release namespace is always added.
excludedNamespaces:
  - kube-system
  - kube-public
  - kube-node-lease

prometheus:
  # -- Prometheus-compatible API (Prometheus, Thanos, Mimir, VictoriaMetrics) with cAdvisor and
  # kube-state-metrics data. Retention should cover the longest learning period.
  url: http://prometheus-server.monitoring.svc
  # -- rate() window for CPU usage; at least 4× the scrape interval.
  rateWindow: 5m
  # -- Finest query resolution, about the scrape interval.
  minStep: 30s
  # -- Longest a query may take, response included, before resourcerer gives up on it; `0s` means no limit.
  # A slow Prometheus then fails a recommendation, which is retried with a backoff, instead of holding a worker.
  timeout: 2m

# -- Cluster defaults for optimization settings, keyed by annotation name without the
# `resourcerer.io/` prefix. Namespaces and workloads override them with annotations.
# Unset keys use the built-in defaults shown in the UI.
defaults: {}
  # cpu.optimization-goal: Balanced
  # memory.optimization-goal: Balanced
  # learning-period: P7D
  # schedule: "@daily"
  # auto-deploy: Disabled

# -- Monthly cost estimates: requests × average replicas × hourly rates × 730.
cost:
  # -- Where the rates come from.
  # `static`: `rates` as they are.
  # `karpenter`: `rates` scaled so the Karpenter nodes cost what Karpenter's price estimates say, spot or on-demand;
  # the UI reports an error when the prices are missing or keep failing.
  # `auto`: `karpenter` when its metrics are in Prometheus, `static` otherwise.
  # A failed recalibration keeps the last good one instead of falling back to `rates`.
  source: auto
  # -- How the rates are split between workloads.
  # `cluster`: every workload at the cluster's average rates.
  # `node`: each workload at the rates of the nodes its pods ran on, weighted by time and requests over the learning
  # period, so on-demand workloads cost more than spot ones. Needs `karpenter` as the source in use;
  # otherwise, and for requests on nodes without a price, the cluster's average applies.
  allocation: cluster
  # -- With `static`, the rates in USD. With `karpenter`, the CPU to memory ratio, and the rates until the first
  # calibration.
  rates:
    cpuCoreHour: 0.0316
    memoryGiBHour: 0.0042
  karpenter:
    # -- How often the rates are recalibrated from node prices (Go duration, at least 30s). Workload costs pick
    # up new rates when their recommendation is next generated.
    refreshInterval: 10m

# -- Reliability signals: when a workload's requests or limits may be too tight, or it is unhealthy for other
# reasons. They show in the workload list, the Reliability tab and the verdict on whether to apply.
# See docs/guides/reliability-signals.md.
reliability:
  # -- Signals resourcerer computes itself; `enabled: false` turns one off, `warn` sets its warning level.
  # OOM kills are always on: the memory recommendation depends on them.
  builtin:
    # -- Share of CFS periods throttled by the CPU limit. Critical from 0.25, where the recommendation raises the
    # limit.
    throttling: { enabled: true, warn: 0.10 }
    # -- Peak working set as a share of the memory limit.
    memoryHeadroom: { enabled: true, warn: 0.90 }
    restarts: { enabled: true }
    crashLoop: { enabled: true }
    hpaAtMax: { enabled: true }
    bestEffort: { enabled: true }
  # -- Signals declared as PromQL templates, evaluated per workload over its learning period (at most 20).
  # Workloads without data for a signal do not show it.
  signals: []
  # - id: http-5xx
  #   name: HTTP 5xx rate
  #   description: Share of requests answered with a 5xx.
  #   unit: ratio                    # ratio | count | seconds | bytes
  #   above: { warn: 0.01, critical: 0.05 }   # or below: for values that should stay high
  #   runbook: https://example.com/runbooks/5xx
  #   query: |
  #     sum(rate(istio_requests_total{response_code=~"5..", destination_workload_namespace="{{ .Namespace }}",
  #       destination_workload="{{ .Name }}"}[{{ .Window }}]))
  #     /
  #     sum(rate(istio_requests_total{destination_workload_namespace="{{ .Namespace }}",
  #       destination_workload="{{ .Name }}"}[{{ .Window }}]))

# -- Apply policies decide when an apply may start: the windows it may start in, freezes, and how many run at
# once. They are ordinary ClusterApplyPolicy objects, listed here so a release can create them from the values
# (teams can still write ApplyPolicy objects in their own namespaces). Without a policy, an apply that is due
# starts at once, as before. The `spec` of each entry is the ClusterApplyPolicy spec: the CRD validates it.
applyPolicies:
  cluster: []
  # - name: business-hours
  #   spec:
  #     namespaceSelector:
  #       matchLabels: { resourcerer.io/environment: production }
  #     appliesTo: [Auto, Manual]      # default Auto: a policy never holds a person back unless it says so
  #     mode: Enforce                  # or Audit, which records what it would have blocked
  #     windows:
  #       - days: [Mon, Tue, Wed, Thu, Fri]
  #         from: "09:00"
  #         to: "17:30"
  #         timeZone: Europe/Lisbon
  #     freezes:
  #       - from: 2026-11-27T00:00:00Z
  #         to: 2026-12-01T00:00:00Z
  #         reason: Black Friday
  #     rate:
  #       maxConcurrent: 1            # or a percentage, such as 25%
  #       maxPerHour: 4
  #       perNamespace: { maxConcurrent: 1 }
  #       cooldown: 24h
  #       spread: 15m

auth:
  # -- How the server identifies the caller.
  # `anonymous`: nobody. Anyone who reaches the Service can use resourcerer with the server's own permissions, which is
  # what makes a port-forward install work without setup. Keep it where the network is the access control.
  # `oidc`: sign in at an OpenID Connect provider. Groups from the token decide who may read and who may apply, and
  # every apply records who asked. Needs `auth.oidc.issuer`, `auth.oidc.clientID` and the two Secret references below.
  # The strategy is a flag on the server, not a ConfigMap key, so changing it restarts the pod and no edit of a
  # ConfigMap can turn authentication off. Switching strategies signs everyone out.
  strategy: anonymous
  # -- `Secure` attribute of the session cookie, which decides whether a browser sends it over plain HTTP.
  # `auto`: set it when the request arrived over TLS or declares `X-Forwarded-Proto: https`. Right when TLS reaches the
  # pod, and right for most Ingress controllers, which forward the protocol.
  # `true`: always set it. Use it behind a proxy that terminates TLS without forwarding the protocol; the chart cannot
  # tell that case apart, so it does not guess, and it would break a port-forward install, which is HTTP.
  # `false`: never set it. Only for an install whose network is the boundary, since the session then crosses the wire
  # in clear text.
  # `true` and `"true"` are the same value here: Helm reads the bare form as a boolean and the chart renders the flag
  # either way.
  cookieSecure: auto
  oidc:
    # -- URL of the provider, as it publishes itself (`https://sso.example.com/realms/example`), with its
    # `/.well-known/openid-configuration` reachable from the server pod. Sessions are dropped when it changes, so a
    # new one means everyone signs in again.
    issuer: ""
    # -- Client the server presents at the provider. It must be a confidential client with the secret referenced
    # below: the server refuses to start without one, so a public client is not supported. It must allow the callback
    # to `<resourcerer>/auth/callback` and use the authorization code flow.
    clientID: ""
    # -- Absolute URL of the callback, for a proxy that rewrites the Host header the server sees.
    # Unset derives it from the request: the host the server sees, with the scheme from TLS, from
    # X-Forwarded-Proto, or from auth.cookieSecure=true. Each way of reaching the install is a different callback, so
    # register them all at the provider: a port-forward signs in at http://localhost:8080/auth/callback and an
    # Ingress at its own URL. With auth.cookieSecure=true the derived scheme is https, which a provider refuses for a
    # port-forward (https://localhost:8080), so leave it at auto where the install is also reached that way.
    redirectURL: ""
    # -- Scopes to request; must include `openid`. Unset asks for `openid profile email`.
    # Ask for a groups scope only when the provider gates the group claim behind one: scopes are visible to the
    # provider and each one is more data handed over.
    scopes: []
    # -- Token claim holding the username, which is what lands in apply history. Unset uses `preferred_username`.
    usernameClaim: ""
    # -- Token claim holding the groups `allowedGroups` and `roles.editorGroups` match against. Unset uses `groups`.
    groupsClaim: ""
    # -- The perimeter: which groups may use resourcerer at all.
    # Empty means every user the provider authenticates gets read access, which on a corporate directory is the whole
    # company. Admitted users still need `roles.editorGroups` to change anything.
    allowedGroups: []
    # -- Secret holding the provider's client secret. Create it yourself (External Secrets, SOPS, `kubectl create
    # secret`); the chart renders only the reference, so the material never sits in values or in a ConfigMap.
    clientSecretSecretRef: { name: "", key: "" }
    roles:
      # -- Groups allowed to apply, revert and change settings.
      # Empty means nobody can apply: the install shows recommendations to everyone and changes nothing until this
      # names a group, which is the safe order to set OIDC up in.
      editorGroups: []
      # -- Whether every user `allowedGroups` admits may at least read. Set to false to give access to
      # `editorGroups` alone: other signed-in users are refused rather than shown a page they cannot act on.
      anyAuthenticatedIsViewer: true
    # -- How long a session stays valid without visiting the provider again: a whole number of minutes (from `5m` to
    # `10080m`) or of hours (from `1h` to `168h`); the chart fails the render outside that range, as would the server
    # at startup. There is no revocation before it expires: a departed employee keeps access for up to one TTL, so the
    # TTL is the trade between comfort and how long a leaked cookie is useful.
    sessionTTL: 12h
  session:
    # -- Secret holding the key that seals the session cookie: standard base64 of exactly 32 bytes
    # (`openssl rand -base64 32`). There is no session store, and reading a session never writes one back, so swapping it
    # signs out everyone whose cookie no mounted key can open. Rotate without that gap in three upgrades: publish the new
    # key as `keyPreviousSecretRef`, where every replica opens it and none seals with it; swap the two, so new cookies
    # carry the new key while the old ones still open; then drop the previous one, which is what ends those cookies, one
    # TTL after the swap — counting the longest `sessionTTL` in force while they were minted, since a cookie keeps the
    # expiry it was given. Doing it in fewer leaves the replicas still on the old configuration refusing what a new
    # replica mints, for as long as a rollout takes.
    keySecretRef: { name: "", key: "" }
    # -- Secret holding the key being retired, still accepted for cookies the new key cannot open.
    # Set only while a rotation is in flight; unset renders nothing.
    keyPreviousSecretRef: { name: "", key: "" }

# -- Refuse every change from the UI and API.
readOnly: false

controller:
  # -- Above 1, replicas use leader election; only one recommends at a time.
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
  extraArgs: []
  # -- Labels and annotations for this component's pods, on top of the global podLabels and podAnnotations.
  podLabels: {}
  podAnnotations: {}

applier:
  # -- The applier is the only component that writes to workloads. Disable it for a recommend-only install.
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }
  extraArgs: []
  podLabels: {}
  podAnnotations: {}

server:
  replicas: 1
  # -- Serve the embedded UI; the API is served either way.
  ui: true
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 192Mi }
  extraArgs: []
  podLabels: {}
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: resourcerer.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

metrics:
  # -- Add prometheus.io/scrape annotations to the metrics Services: the controller's, the server's, and the
  # applier's when it is enabled. The UI charts recommendation history from the resourcerer_recommendation metric,
  # the applier's `resourcerer_apply_*` counters are how a held herd of applies becomes visible, and every component
  # counts the queries it sends to Prometheus.
  scrapeAnnotations: true
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor instead, for every metrics Service.
    enabled: false
    interval: 30s
    labels: {}

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
