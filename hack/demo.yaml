# Demo workloads with deliberately wrong requests. stress-ng burns a fixed share of CPU and holds memory.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# Over-provisioned: requests 500m / 1Gi, uses ~100m / ~60Mi. The istio-proxy sidecar is not optimized by default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "10", "--vm", "1", "--vm-bytes", "60M", "--vm-keep", "--vm-hang", "0", "--timeout", "0", "--quiet"]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
        - name: istio-proxy
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "3", "--vm", "1", "--vm-bytes", "20M", "--vm-keep", "--vm-hang", "0", "--timeout", "0", "--quiet"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
# Under-provisioned: requests 50m / 64Mi, uses ~400m / ~100Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: demo
  annotations:
    resourcerer.io/cpu.optimization-goal: Reliability
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "40", "--vm", "1", "--vm-bytes", "100M", "--vm-keep", "--vm-hang", "0", "--timeout", "0", "--quiet"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: demo
spec:
  replicas: 1
  serviceName: cache
  selector:
    matchLabels: { app: cache }
  template:
    metadata:
      labels: { app: cache }
    spec:
      containers:
        - name: cache
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "15", "--vm", "1", "--vm-bytes", "100M", "--vm-keep", "--vm-hang", "0", "--timeout", "0", "--quiet"]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: demo
spec:
  selector:
    matchLabels: { app: log-agent }
  template:
    metadata:
      labels: { app: log-agent }
    spec:
      containers:
        - name: log-agent
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "2", "--vm", "1", "--vm-bytes", "20M", "--vm-keep", "--vm-hang", "0", "--timeout", "0", "--quiet"]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
# CPU-scaled by an HPA: the recommendation also proposes a new target utilization.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "20", "--vm", "1", "--vm-bytes", "50M", "--vm-keep", "--vm-hang", "0", "--timeout", "0", "--quiet"]
          resources:
            requests: { cpu: 300m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: demo
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
# No requests at all: best-effort pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: indexer }
  template:
    metadata:
      labels: { app: indexer }
    spec:
      containers:
        - name: indexer
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "30", "--vm", "1", "--vm-bytes", "150M", "--vm-keep", "--vm-hang", "0", "--timeout", "0", "--quiet"]
---
# Namespace-level settings: every workload here deploys recommendations automatically.
apiVersion: v1
kind: Namespace
metadata:
  name: payments
  annotations:
    resourcerer.io/auto-deploy: Enabled
    resourcerer.io/memory.optimization-goal: Reliability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
    spec:
      containers:
        - name: checkout
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "12", "--vm", "1", "--vm-bytes", "80M", "--vm-keep", "--vm-hang", "0", "--timeout", "0", "--quiet"]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 768Mi }
---
# Leaks memory until the 320Mi limit kills it, then starts over. Auto-deploy is turned off for this one workload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: payments
  annotations:
    resourcerer.io/auto-deploy: Disabled
spec:
  replicas: 1
  selector:
    matchLabels: { app: ledger }
  template:
    metadata:
      labels: { app: ledger }
    spec:
      containers:
        - name: ledger
          image: ghcr.io/colinianking/stress-ng:latest
          command: ["sh", "-c"]
          args:
            - |
              n=150
              while true; do
                stress-ng --vm 1 --vm-bytes ${n}M --vm-keep --vm-hang 0 --timeout 30s --quiet
                n=$((n + 20))
              done
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 320Mi }
---
# Argo Rollout with its own template; applying starts a canary.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: storefront
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: storefront }
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 10s }
  template:
    metadata:
      labels: { app: storefront }
    spec:
      containers:
        - name: storefront
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "4", "--vm", "1", "--vm-bytes", "40M", "--vm-keep", "--vm-hang", "0", "--timeout", "0", "--quiet"]
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
# Argo Rollout that takes its template from a Deployment (spec.workloadRef). The Deployment stays at
# zero replicas; resourcerer recommends for the Rollout and applies to the Deployment's template.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-template
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: { app: billing }
  template:
    metadata:
      labels: { app: billing }
    spec:
      containers:
        - name: billing
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "3", "--vm", "1", "--vm-bytes", "30M", "--vm-keep", "--vm-hang", "0", "--timeout", "0", "--quiet"]
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 300m, memory: 384Mi }
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: billing
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: billing }
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-template
  strategy:
    canary:
      steps:
        - setWeight: 100
---
# Same requests on an on-demand and on spot nodes (labels set by hack/fake-karpenter.sh): node allocation
# must price the first about 3x the second.
apiVersion: v1
kind: Namespace
metadata:
  name: pricing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: on-demand-app
  namespace: pricing
spec:
  replicas: 1
  selector:
    matchLabels: { app: on-demand-app }
  template:
    metadata:
      labels: { app: on-demand-app }
    spec:
      nodeSelector: { karpenter.sh/capacity-type: on-demand }
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: { requests: { cpu: 100m, memory: 128Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spot-app
  namespace: pricing
spec:
  replicas: 1
  selector:
    matchLabels: { app: spot-app }
  template:
    metadata:
      labels: { app: spot-app }
    spec:
      nodeSelector: { karpenter.sh/capacity-type: spot }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources: { requests: { cpu: 100m, memory: 128Mi } }
