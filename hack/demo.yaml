# Demo workloads with deliberately wrong requests, so VPA has something to recommend.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# Over-provisioned: requests 1 CPU / 1Gi, uses ~100m / ~60Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "10", "--vm", "1", "--vm-bytes", "60M", "--vm-keep", "--vm-hang", "0", "--timeout", "0"]
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
---
# Under-provisioned: requests 50m / 64Mi, uses ~400m / ~100Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "40", "--vm", "1", "--vm-bytes", "100M", "--vm-keep", "--vm-hang", "0", "--timeout", "0"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: demo
spec:
  replicas: 1
  serviceName: cache
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "15", "--vm", "1", "--vm-bytes", "100M", "--vm-keep", "--vm-hang", "0", "--timeout", "0"]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: demo
spec:
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: ghcr.io/colinianking/stress-ng:latest
          args: ["--cpu", "1", "--cpu-load", "2", "--vm", "1", "--vm-bytes", "16M", "--vm-keep", "--vm-hang", "0", "--timeout", "0"]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
