# Minimal Prometheus for the kind environment: cAdvisor and kube-state-metrics are all resourcerer needs.
alertmanager:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 48Mi }
server:
  retention: 15d
  # Short so a fresh cluster has the history a recommendation needs within a minute; the e2e waits for it.
  global:
    scrape_interval: 5s
    evaluation_interval: 5s
  persistentVolume:
    enabled: true
    size: 4Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }
