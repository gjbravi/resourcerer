# Minimal Prometheus for the kind environment: cAdvisor and kube-state-metrics are all resourcerer needs.
alertmanager:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 48Mi }
server:
  retention: 15d
  global:
    scrape_interval: 10s
    evaluation_interval: 10s
  persistentVolume:
    enabled: true
    size: 4Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }
