# Values for the kind environment: short periods so recommendations show up within minutes.
clusterName: kind-resourcerer
prometheus:
  url: http://prometheus-server.monitoring.svc
  rateWindow: 40s
  # Finer than cAdvisor's 10–17s samples, so a fresh cluster reaches the 10 samples a recommendation needs in
  # under a minute; the e2e waits for that.
  minStep: 5s
defaults:
  learning-period: PT15M
  schedule: "@every 1m"
# hack/fake-karpenter.sh serves Karpenter's metrics with fixed prices.
cost:
  source: karpenter
  allocation: node
excludedNamespaces:
  - kube-system
  - kube-public
  - kube-node-lease
  - local-path-storage
  - monitoring
  - argo-rollouts
  - karpenter
# Declared signals from metrics kind has, so the Reliability tab and e2e cover them.
reliability:
  signals:
    - id: cpu-hot
      name: CPU used of requested
      description: Pods use most of their CPU request; bursts compete for CPU with their neighbours.
      unit: ratio
      above: { warn: 0.8, critical: 1.0 }
      query: |
        sum(rate(container_cpu_usage_seconds_total{namespace="{{ .Namespace }}", container!="", container!="POD"}[{{ .Window }}])
          * on (namespace, pod) group_left () {{ .OwnedPods }})
        /
        sum(kube_pod_container_resource_requests{namespace="{{ .Namespace }}", resource="cpu"}
          * on (namespace, pod) group_left () {{ .OwnedPods }})
    - id: memory-over-request
      name: Memory above request
      description: Working set above the memory request; these pods are evicted first under node memory pressure.
      unit: ratio
      above: { warn: 1.0, critical: 1.5 }
      query: |
        max by (container) (max_over_time(container_memory_working_set_bytes{namespace="{{ .Namespace }}", container!="", container!="POD"}[{{ .Window }}])
          * on (namespace, pod) group_left () {{ .OwnedPods }})
        /
        max by (container) (kube_pod_container_resource_requests{namespace="{{ .Namespace }}", resource="memory"}
          * on (namespace, pod) group_left () {{ .OwnedPods }})

# Rendered by the chart: it selects namespaces labelled resourcerer.io/apply-policy=strict, which the e2e
# adds and removes. Declaring it here is what checks the chart path, not the policy itself.
applyPolicies:
  cluster:
    - name: strict-namespace-window
      spec:
        namespaceSelector:
          matchLabels:
            resourcerer.io/apply-policy: strict
        appliesTo: [Auto, Manual]
        windows:
          - days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
            from: "00:00"
            to: "23:59"
        rate:
          maxConcurrent: 1
# make kind-up runs Grafana with the dashboard sidecar (hack/grafana-values.yaml), which loads this one.
metrics:
  grafanaDashboard:
    enabled: true
