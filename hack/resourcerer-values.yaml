# Values for the kind environment: short periods so recommendations show up within minutes.
clusterName: kind-resourcerer
prometheus:
  url: http://prometheus-server.monitoring.svc
  rateWindow: 40s
  minStep: 10s
defaults:
  learning-period: PT15M
  schedule: "@every 1m"
excludedNamespaces:
  - kube-system
  - kube-public
  - kube-node-lease
  - local-path-storage
  - monitoring
  - argo-rollouts
