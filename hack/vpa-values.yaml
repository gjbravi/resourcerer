# VPA tuned for a fast local feedback loop; not suitable for production.
fullnameOverride: vpa
recommender:
  replicas: 1
  podDisruptionBudget:
    enabled: false
  extraArgs:
    - --pod-recommendation-min-cpu-millicores=5
    - --pod-recommendation-min-memory-mb=16
    - --memory-aggregation-interval=1h
    - --memory-aggregation-interval-count=24
    - --cpu-histogram-decay-half-life=6h
    - --memory-histogram-decay-half-life=6h
updater:
  replicas: 1
  podDisruptionBudget:
    enabled: false
  extraArgs:
    - --min-replicas=1
    - --updater-interval=30s
admissionController:
  replicas: 1
  podDisruptionBudget:
    enabled: false
