# The documentation site, built with Zensical from docs/ and published to GitHub Pages
# (.github/workflows/docs.yaml). `make docs-dev` previews it, `make docs-build` builds it strictly.
site_name: resourcerer
site_url: https://gjbravi.github.io/resourcerer/
site_description: >-
  Self-hosted Kubernetes rightsizing: CPU and memory recommendations from your own Prometheus, with the savings, the
  risk and the reasons behind every number.
repo_name: gjbravi/resourcerer
repo_url: https://github.com/gjbravi/resourcerer
edit_uri: edit/main/docs/
copyright: Apache-2.0

docs_dir: docs
site_dir: website/site

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/diagrams.js

theme:
  name: material
  variant: modern
  logo: logo.svg
  favicon: logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
    admonition:
      note: octicons/tag-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      warning: octicons/alert-16
      danger: octicons/zap-16
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon-star
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  # Mermaid blocks get their own class, so the theme leaves them alone and assets/javascripts/diagrams.js renders
  # them with zoom and full screen.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: rz-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gjbravi/resourcerer

